[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timew_to_odoo"
description = "Synchronize entries from Timewarrior to timesheets in an Odoo database"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
version = "0.1.0"
dependencies = [
    "python-dateutil>=2,<3",
]

[project.scripts]
timew_to_odoo = "timew_to_odoo.__main__:main"

[tool.setuptools]
packages = ["timew_to_odoo", "timew_to_odoo.converters", "converters"]